<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — Citas</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-bg-soft: #111111;
            --color-white: #f5f5f5;
            --color-text: #c8c8c8;
            --color-muted: #777777;
            --color-accent: #c5a46d;
            --font-display: "Cormorant Garamond", serif;
            --font-body: "Manrope", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-white);
            font-family: var(--font-body);
            padding: 50px 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            max-width: 1000px;
            margin: 0 auto 40px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 42px;
            font-weight: 400;
        }

        h1 em { font-style: italic; color: var(--color-muted); }

        header p {
            color: var(--color-muted);
            font-size: 12px;
        }

        header a {
            color: var(--color-accent);
            font-size: 11px;
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        th {
            color: var(--color-muted);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .estado {
            display: inline-block;
            padding: 4px 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .estado-pendiente { background: rgba(197, 164, 109, 0.15); color: var(--color-accent); }
        .estado-confirmada { background: rgba(90, 180, 120, 0.15); color: #7fce9d; }
        .estado-cancelada { background: rgba(255, 255, 255, 0.06); color: var(--color-muted); }

        .empty {
            padding: 60px 0;
            text-align: center;
            color: var(--color-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Panel de <em>citas.</em></h1>
            <p>Sesión: {{ usuario }}</p>
        </div>
        <a href="{{ url_for('logout') }}">Cerrar sesión →</a>
    </header>

    <div class="wrap">

        <table id="tablaCitas">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>WhatsApp</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Idea</th>
                    <th>Origen</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>

        <div class="empty" id="estadoVacio" style="display: none;">
            Todavía no hay citas agendadas.
        </div>

    </div>

    <script>
        async function cargarCitas() {

            const respuesta = await fetch("/api/admin/citas");
            const citas = await respuesta.json();

            const cuerpo = document.getElementById("cuerpoTabla");
            const vacio = document.getElementById("estadoVacio");

            if (citas.length === 0) {
                vacio.style.display = "block";
                return;
            }

            citas.forEach(cita => {

                const props = cita.extendedProps;
                const [fecha, hora] = cita.start.split("T");

                const fila = document.createElement("tr");

                fila.innerHTML = `
                    <td>${cita.title}</td>
                    <td>${props.telefono || "—"}</td>
                    <td>${fecha}</td>
                    <td>${hora}</td>
                    <td>${props.idea || "—"}</td>
                    <td>${props.creada_por_cliente ? "Cliente (web)" : "Manual"}</td>
                    <td><span class="estado estado-${props.estado}">${props.estado}</span></td>
                `;

                cuerpo.appendChild(fila);

            });

        }

        cargarCitas();
    </script>

</body>
</html>
