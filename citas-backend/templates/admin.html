<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — Calendario de citas</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-bg-soft: #111111;
            --color-bg-light: #171717;
            --color-white: #f5f5f5;
            --color-text: #c8c8c8;
            --color-muted: #777777;
            --color-accent: #c5a46d;
            --font-display: "Cormorant Garamond", serif;
            --font-body: "Manrope", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-white);
            font-family: var(--font-body);
            padding: 40px 30px 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            max-width: 1100px;
            margin: 0 auto 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 40px;
            font-weight: 400;
        }

        h1 em { font-style: italic; color: var(--color-muted); }

        header p { color: var(--color-muted); font-size: 12px; margin-top: 4px; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-link {
            color: var(--color-accent);
            font-size: 11px;
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .wrap { max-width: 1100px; margin: 0 auto; }

        /* =====================================================
           TARJETAS DE RESUMEN
        ===================================================== */

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            padding: 20px 22px;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .stat-card:hover {
            border-color: rgba(197, 164, 109, 0.35);
        }

        .stat-card strong {
            display: block;
            font-family: var(--font-display);
            font-size: 34px;
            font-weight: 400;
            color: var(--color-white);
        }

        .stat-card span {
            display: block;
            margin-top: 4px;
            color: var(--color-muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat-card.accent strong { color: var(--color-accent); }

        .stat-card.proxima strong {
            font-size: 20px;
            line-height: 1.3;
        }

        .stat-card.proxima .proxima-cuando {
            color: var(--color-accent);
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 600;
        }

        /* =====================================================
           LEYENDA
        ===================================================== */

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 22px;
            margin-bottom: 20px;
            padding: 14px 18px;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-muted);
            font-size: 11px;
            letter-spacing: 0.03em;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
        }

        .legend-dot.dot-pendiente { background: var(--color-accent); }
        .legend-dot.dot-confirmada { background: #7fce9d; }
        .legend-dot.dot-cancelada { background: rgba(255, 255, 255, 0.25); }
        .legend-dot.dot-manual { background: #6c7a89; }

        /* =====================================================
           BOTONES GENERALES
        ===================================================== */

        .btn {
            padding: 12px 18px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background: var(--color-white); color: var(--color-bg); }
        .btn-primary:hover { background: var(--color-accent); }

        .btn-danger {
            background: transparent;
            color: #e28f8f;
            border: 1px solid rgba(220, 80, 80, 0.4);
        }
        .btn-danger:hover { background: rgba(220, 80, 80, 0.12); }

        .btn-ghost {
            background: transparent;
            color: var(--color-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-ghost:hover { color: var(--color-white); border-color: rgba(255, 255, 255, 0.3); }

        /* =====================================================
           OVERRIDES DE FULLCALENDAR PARA TEMA OSCURO
        ===================================================== */

        #calendar {
            --fc-border-color: rgba(255, 255, 255, 0.1);
            --fc-page-bg-color: var(--color-bg-soft);
            --fc-neutral-bg-color: var(--color-bg-light);
            --fc-list-event-hover-bg-color: var(--color-bg-light);
            --fc-today-bg-color: rgba(197, 164, 109, 0.08);
            --fc-event-bg-color: var(--color-accent);
            --fc-event-border-color: var(--color-accent);
            --fc-event-text-color: var(--color-bg);
            --fc-button-bg-color: var(--color-bg-light);
            --fc-button-border-color: rgba(255, 255, 255, 0.15);
            --fc-button-hover-bg-color: var(--color-accent);
            --fc-button-hover-border-color: var(--color-accent);
            --fc-button-active-bg-color: var(--color-accent);
            --fc-button-text-color: var(--color-white);
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            font-size: 13px;
        }

        #calendar .fc-toolbar-title {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 24px;
            color: var(--color-white);
            text-transform: capitalize;
        }

        #calendar .fc-col-header-cell-cushion,
        #calendar .fc-daygrid-day-number {
            color: var(--color-text);
            text-decoration: none;
        }

        #calendar .fc-button {
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.05em;
            font-weight: 600;
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        #calendar .fc-daygrid-day:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        #calendar .fc-day-today {
            box-shadow: inset 0 0 0 1px rgba(197, 164, 109, 0.4);
        }

        #calendar .fc-event {
            cursor: pointer;
            font-size: 11px;
            padding: 1px 3px;
            border-radius: 0;
        }

        .fc-event-manual {
            --fc-event-bg-color: #6c7a89 !important;
            --fc-event-border-color: #6c7a89 !important;
        }

        .fc-event-cancelada {
            --fc-event-bg-color: rgba(255, 255, 255, 0.15) !important;
            --fc-event-border-color: rgba(255, 255, 255, 0.15) !important;
            text-decoration: line-through;
        }

        .fc-event-confirmada {
            --fc-event-bg-color: #7fce9d !important;
            --fc-event-border-color: #7fce9d !important;
        }

        /* =====================================================
           MODAL
        ===================================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            width: min(90%, 440px);
            max-height: 85vh;
            overflow-y: auto;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px;
        }

        .modal-box h2 {
            font-family: var(--font-display);
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-row { margin-bottom: 18px; }

        .modal-row label {
            display: block;
            margin-bottom: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-muted);
        }

        .modal-row p,
        .modal-row a {
            font-size: 14px;
            color: var(--color-white);
            text-decoration: none;
        }

        .modal-row a { color: var(--color-accent); }

        .modal-row input,
        .modal-row select,
        .modal-row textarea {
            width: 100%;
            padding: 10px 12px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: 13px;
            outline: none;
        }

        .modal-row input:focus,
        .modal-row select:focus,
        .modal-row textarea:focus {
            border-color: var(--color-accent);
        }

        .modal-row select { cursor: pointer; }
        .modal-row textarea { resize: vertical; min-height: 60px; }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* =====================================================
           BUSCADOR / FILTRO
        ===================================================== */

        .toolbar-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 14px;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-box input:focus { border-color: var(--color-accent); }
        .search-box input::placeholder { color: var(--color-muted); }

        .filter-select {
            padding: 12px 14px;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        /* =====================================================
           TOASTS
        ===================================================== */

        .toast-stack {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 240px;
            max-width: 340px;
            padding: 14px 18px;
            background: var(--color-bg-light);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 3px solid var(--color-accent);
            color: var(--color-white);
            font-size: 12.5px;
            line-height: 1.4;
            opacity: 0;
            transform: translateX(20px);
            animation: toast-in 0.3s ease forwards, toast-out 0.3s ease forwards 3.2s;
        }

        .toast.error { border-left-color: #e28f8f; }
        .toast.success { border-left-color: #7fce9d; }

        @keyframes toast-in {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toast-out {
            to { opacity: 0; transform: translateX(20px); }
        }

        /* =====================================================
           MODAL: animación + extras
        ===================================================== */

        .modal-overlay {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active { opacity: 1; }

        .modal-box {
            transform: scale(0.96) translateY(6px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .estado-badge {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .estado-badge.pendiente { background: var(--color-accent); }
        .estado-badge.confirmada { background: #7fce9d; }
        .estado-badge.cancelada { background: rgba(255, 255, 255, 0.3); }

        .cuenta-regresiva {
            display: block;
            margin-top: 2px;
            color: var(--color-accent);
            font-size: 11px;
        }

        /* =====================================================
           FLUJO DE CONFIRMACIÓN: WhatsApp + Confirmar cita
        ===================================================== */

        .confirm-flow {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(197, 164, 109, 0.06);
            border: 1px solid rgba(197, 164, 109, 0.2);
        }

        .confirm-flow-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-muted);
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 18px;
            background: #25d366;
            color: #0a0a0a;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .btn-whatsapp:hover { background: #2fe374; }
        .btn-whatsapp:active { transform: scale(0.98); }

        .btn-whatsapp svg { width: 15px; height: 15px; flex-shrink: 0; }

        .btn-confirmar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 18px;
            background: var(--color-bg-light);
            color: var(--color-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        .btn-confirmar.lista {
            background: var(--color-accent);
            color: #0a0a0a;
            border-color: var(--color-accent);
        }

        .btn-confirmar.lista:hover { background: #d4b585; }

        .btn-confirmar.hecha {
            background: rgba(127, 206, 157, 0.15);
            color: #7fce9d;
            border-color: rgba(127, 206, 157, 0.4);
            cursor: default;
        }

        /* =====================================================
           EVENTOS DEL CALENDARIO: ícono de pendiente
        ===================================================== */

        .fc-event-pendiente-icon::after {
            content: "●";
            margin-left: 4px;
            font-size: 8px;
            vertical-align: middle;
        }

        @media (max-width: 600px) {

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .legend-row {
                gap: 14px;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
            }

        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Panel de <em>citas.</em></h1>
            <p>Sesión: {{ usuario }}</p>
        </div>

        <div class="header-right">
            <button class="btn btn-primary" id="btnNuevaCita">+ Nueva cita</button>
            <a class="logout-link" href="{{ url_for('logout') }}">Cerrar sesión →</a>
        </div>
    </header>

    <div class="wrap">

        <div class="stats-row">
            <div class="stat-card accent">
                <strong id="statHoy">0</strong>
                <span>Citas hoy</span>
            </div>
            <div class="stat-card">
                <strong id="statPendientes">0</strong>
                <span>Pendientes</span>
            </div>
            <div class="stat-card">
                <strong id="statConfirmadas">0</strong>
                <span>Confirmadas</span>
            </div>
            <div class="stat-card proxima">
                <strong id="statProxima">—</strong>
                <span>Próxima cita <span class="proxima-cuando" id="statProximaCuando"></span></span>
            </div>
        </div>

        <div class="legend-row">
            <div class="legend-item"><span class="legend-dot dot-pendiente"></span> Pendiente</div>
            <div class="legend-item"><span class="legend-dot dot-confirmada"></span> Confirmada</div>
            <div class="legend-item"><span class="legend-dot dot-cancelada"></span> Cancelada</div>
            <div class="legend-item"><span class="legend-dot dot-manual"></span> Creada manualmente</div>
        </div>

        <div class="toolbar-row">
            <div class="search-box">
                <input type="text" id="buscarCliente" placeholder="Buscar cliente por nombre...">
            </div>
            <select class="filter-select" id="filtrarEstado">
                <option value="todas">Todos los estados</option>
                <option value="pendiente">Pendientes</option>
                <option value="confirmada">Confirmadas</option>
                <option value="cancelada">Canceladas</option>
            </select>
        </div>

        <div id="calendar"></div>
    </div>

    <div class="toast-stack" id="toastStack"></div>


    <!-- ============ MODAL: DETALLE DE CITA ============ -->

    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-box">

            <div class="modal-title-row">
                <span class="estado-badge pendiente" id="detalleBadge"></span>
                <h2 style="border:0; padding:0; margin:0;">Detalle de la cita</h2>
            </div>
            <div style="height:20px"></div>

            <div class="confirm-flow">
                <span class="confirm-flow-label">Confirmar esta cita</span>
                <a class="btn-whatsapp" id="btnWhatsapp" href="#" target="_blank">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.2h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.1c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.11.11-1.8-.11-.42-.13-.95-.31-1.63-.6-2.87-1.24-4.74-4.13-4.89-4.32-.14-.19-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.26-.28.57-.35.76-.35h.55c.18 0 .42-.07.65.5.24.58.81 2 .88 2.15.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.16-.29.36-.42.48-.14.14-.28.29-.12.56.16.28.7 1.16 1.51 1.88 1.04.93 1.91 1.22 2.19 1.36.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.37-.23.62-.14.26.09 1.62.77 1.9.91.28.14.46.21.53.33.07.12.07.7-.17 1.38z"/></svg>
                    Contactar por WhatsApp
                </a>
                <button class="btn-confirmar" id="btnConfirmarCita">✓ Confirmar cita</button>
            </div>

            <div class="modal-row">
                <label>Cliente</label>
                <p id="detalleNombre"></p>
            </div>

            <div class="modal-row">
                <label>WhatsApp</label>
                <a id="detalleTelefono" href="#" target="_blank"></a>
            </div>

            <div class="modal-row">
                <label>Correo</label>
                <p id="detalleEmail"></p>
            </div>

            <div class="modal-row">
                <label>Fecha y hora</label>
                <p id="detalleFechaHora"></p>
                <span class="cuenta-regresiva" id="detalleCuentaRegresiva"></span>
            </div>

            <div class="modal-row">
                <label>Duración</label>
                <p id="detalleDuracion"></p>
            </div>

            <div class="modal-row">
                <label>Tipo de cita</label>
                <select id="detalleTipo">
                    <option value="valoracion">Valoración</option>
                    <option value="tatuaje">Tatuaje</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Idea del tatuaje</label>
                <p id="detalleIdea"></p>
            </div>

            <div class="modal-row">
                <label>Estado</label>
                <select id="detalleEstado">
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmada">Confirmada</option>
                    <option value="cancelada">Cancelada</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Notas internas</label>
                <textarea id="detalleNotas" placeholder="Notas privadas sobre esta cita..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-danger" id="btnEliminarCita">Eliminar</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-ghost" id="btnCerrarDetalle">Cerrar</button>
                    <button class="btn btn-primary" id="btnGuardarDetalle">Guardar</button>
                </div>
            </div>

        </div>
    </div>


    <!-- ============ MODAL: CREAR CITA MANUAL ============ -->

    <div class="modal-overlay" id="modalCrear">
        <div class="modal-box">

            <h2>Nueva cita manual</h2>

            <div class="modal-row">
                <label>Fecha</label>
                <input type="date" id="crearFecha">
            </div>

            <div class="modal-row">
                <label>Hora</label>
                <input type="time" id="crearHora" min="10:00" max="19:00" step="1800">
            </div>

            <div class="modal-row">
                <label>Duración</label>
                <select id="crearDuracion">
                    <option value="30">30 minutos</option>
                    <option value="60">1 hora</option>
                    <option value="90">1 hora 30 min</option>
                    <option value="120">2 horas</option>
                    <option value="180">3 horas</option>
                    <option value="240">4 horas</option>
                    <option value="300">5 horas</option>
                    <option value="360">6 horas</option>
                    <option value="420">7 horas</option>
                    <option value="480">8 horas (jornada completa)</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Tipo de cita</label>
                <select id="crearTipo">
                    <option value="valoracion">Valoración</option>
                    <option value="tatuaje">Tatuaje</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Nombre del cliente *</label>
                <input type="text" id="crearNombre" placeholder="Nombre completo">
            </div>

            <div class="modal-row">
                <label>WhatsApp</label>
                <input type="tel" id="crearTelefono" placeholder="300 123 4567">
            </div>

            <div class="modal-row">
                <label>Idea / notas</label>
                <textarea id="crearIdea" placeholder="¿Qué se va a tatuar?"></textarea>
            </div>

            <div class="modal-actions">
                <div></div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-ghost" id="btnCerrarCrear">Cancelar</button>
                    <button class="btn btn-primary" id="btnGuardarCrear">Crear cita</button>
                </div>
            </div>

        </div>
    </div>


    <script>
        let citaSeleccionadaId = null;
        let eventoSeleccionado = null;
        let todosLosEventos = [];

        /* ============ TOASTS ============ */

        function mostrarToast(mensaje, tipo = "info") {
            const stack = document.getElementById("toastStack");
            const toast = document.createElement("div");
            toast.className = `toast ${tipo}`;
            toast.textContent = mensaje;
            stack.appendChild(toast);
            setTimeout(() => toast.remove(), 3600);
        }

        /* ============ ANIMACIÓN DE CONTEO ============ */

        function animarNumero(el, valorFinal) {
            const inicio = Number(el.dataset.valor || 0);
            if (inicio === valorFinal) return;
            el.dataset.valor = valorFinal;
            const duracion = 500;
            const t0 = performance.now();
            function paso(t) {
                const progreso = Math.min((t - t0) / duracion, 1);
                const valorActual = Math.round(inicio + (valorFinal - inicio) * progreso);
                el.textContent = valorActual;
                if (progreso < 1) requestAnimationFrame(paso);
            }
            requestAnimationFrame(paso);
        }

        function textoRelativo(fecha) {
            const ahora = new Date();
            const diffMs = fecha - ahora;
            const diffMin = Math.round(diffMs / 60000);
            if (diffMin < 0) return "ya pasó";
            if (diffMin < 60) return `en ${diffMin} min`;
            const diffHoras = Math.round(diffMin / 60);
            if (diffHoras < 24) return `en ${diffHoras}h`;
            const diffDias = Math.round(diffHoras / 24);
            if (diffDias === 1) return "mañana";
            return `en ${diffDias} días`;
        }

        const calendarEl = document.getElementById("calendar");

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth",
            locale: "es",
            height: "auto",
            firstDay: 1,
            headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek,timeGridDay",
            },
            buttonText: {
                today: "Hoy",
                month: "Mes",
                week: "Semana",
                day: "Día",
            },

            /* Horario visible en vistas de semana/día: 10am - 7pm */
            slotMinTime: "10:00:00",
            slotMaxTime: "19:00:00",
            slotDuration: "00:30:00",
            allDaySlot: false,
            nowIndicator: true,

            events: "/api/admin/citas",

            editable: true,
            eventStartEditable: true,

            eventClassNames(arg) {
                const props = arg.event.extendedProps;
                const clases = [];
                if (props.estado === "cancelada") clases.push("fc-event-cancelada");
                else if (props.estado === "confirmada") clases.push("fc-event-confirmada");
                else if (!props.creada_por_cliente) clases.push("fc-event-manual");
                if (props.estado === "pendiente") clases.push("fc-event-pendiente-icon");
                return clases;
            },

            eventDidMount(arg) {
                const props = arg.event.extendedProps;
                const hora = arg.event.start.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
                arg.el.setAttribute("title", `${arg.event.title} · ${hora}${props.estado === "pendiente" ? " · sin confirmar" : ""}`);
            },

            eventDrop(info) {
                const nuevaFecha = info.event.start.toISOString();
                fetch(`/api/admin/citas/${info.event.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ fecha_hora: nuevaFecha }),
                }).then(async (respuesta) => {
                    if (!respuesta.ok) {
                        const data = await respuesta.json().catch(() => ({}));
                        mostrarToast(data.error || "Ese horario choca con otra cita.", "error");
                        info.revert();
                        return;
                    }
                    mostrarToast("Cita movida de horario.", "success");
                }).catch(() => {
                    mostrarToast("No se pudo mover la cita.", "error");
                    info.revert();
                });
            },

            eventClick(info) {
                abrirDetalle(info.event);
            },

            dateClick(info) {
                abrirCrear(info.dateStr, info.date);
            },

            eventsSet(events) {
                todosLosEventos = events;
                actualizarResumen(events);
                aplicarFiltro();
            },
        });

        calendar.render();


        /* ============ TARJETAS DE RESUMEN ============ */

        function actualizarResumen(events) {

            const hoy = new Date().toISOString().split("T")[0];
            const ahora = new Date();

            let citasHoy = 0;
            let pendientes = 0;
            let confirmadas = 0;
            let proxima = null;

            events.forEach(event => {

                const fechaEvento = event.startStr.split("T")[0];
                const estado = event.extendedProps.estado;

                if (fechaEvento === hoy) citasHoy++;
                if (estado === "pendiente") pendientes++;
                if (estado === "confirmada") confirmadas++;

                if (estado !== "cancelada" && event.start > ahora) {
                    if (!proxima || event.start < proxima.start) proxima = event;
                }

            });

            animarNumero(document.getElementById("statHoy"), citasHoy);
            animarNumero(document.getElementById("statPendientes"), pendientes);
            animarNumero(document.getElementById("statConfirmadas"), confirmadas);

            const elProxima = document.getElementById("statProxima");
            const elCuando = document.getElementById("statProximaCuando");

            if (proxima) {
                elProxima.textContent = proxima.title;
                elCuando.textContent = textoRelativo(proxima.start);
            } else {
                elProxima.textContent = "—";
                elCuando.textContent = "";
            }

        }

        /* ============ BUSCADOR Y FILTRO ============ */

        function aplicarFiltro() {

            const texto = (document.getElementById("buscarCliente")?.value || "").trim().toLowerCase();
            const estadoFiltro = document.getElementById("filtrarEstado")?.value || "todas";

            todosLosEventos.forEach(event => {
                const coincideTexto = !texto || event.title.toLowerCase().includes(texto);
                const coincideEstado = estadoFiltro === "todas" || event.extendedProps.estado === estadoFiltro;
                const visible = coincideTexto && coincideEstado;
                if (event.setProp) event.setProp("display", visible ? "auto" : "none");
            });

        }

        document.getElementById("buscarCliente").addEventListener("input", aplicarFiltro);
        document.getElementById("filtrarEstado").addEventListener("change", aplicarFiltro);


        /* ============ DETALLE DE CITA ============ */

        function abrirDetalle(event) {

            citaSeleccionadaId = event.id;
            eventoSeleccionado = event;
            const props = event.extendedProps;

            document.getElementById("detalleNombre").textContent = event.title;

            const badge = document.getElementById("detalleBadge");
            badge.className = `estado-badge ${props.estado || "pendiente"}`;

            const telLink = document.getElementById("detalleTelefono");
            const btnWhatsapp = document.getElementById("btnWhatsapp");
            const telLimpio = (props.telefono || "").replace(/\D/g, "");
            telLink.textContent = props.telefono || "—";

            if (telLimpio) {

                const fechaCita = new Date(event.start);
                const fechaTexto = fechaCita.toLocaleDateString("es-CO", {
                    weekday: "long", day: "numeric", month: "long"
                });
                const horaTexto = fechaCita.toLocaleTimeString("es-CO", {
                    hour: "2-digit", minute: "2-digit"
                });

                const tipoTexto = props.tipo_cita === "tatuaje" ? "tu sesión de tatuaje" : "tu valoración";

                const mensaje =
                    `Hola ${event.title}, te confirmo ${tipoTexto} el ${fechaTexto} ` +
                    `a las ${horaTexto}. ¡Nos vemos!`;

                const link = `https://wa.me/${telLimpio}?text=${encodeURIComponent(mensaje)}`;
                telLink.href = link;
                btnWhatsapp.href = link;
                btnWhatsapp.style.pointerEvents = "auto";
                btnWhatsapp.style.opacity = "1";

            } else {
                telLink.href = "#";
                btnWhatsapp.href = "#";
                btnWhatsapp.style.pointerEvents = "none";
                btnWhatsapp.style.opacity = "0.4";
            }

            document.getElementById("detalleEmail").textContent = props.email || "—";

            const fecha = new Date(event.start);
            document.getElementById("detalleFechaHora").textContent =
                fecha.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" }) +
                " · " +
                fecha.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });

            document.getElementById("detalleCuentaRegresiva").textContent =
                fecha > new Date() ? textoRelativo(fecha) : "";

            document.getElementById("detalleIdea").textContent = props.idea || "—";
            document.getElementById("detalleEstado").value = props.estado || "pendiente";
            document.getElementById("detalleTipo").value = props.tipo_cita || "valoracion";
            document.getElementById("detalleNotas").value = props.notas || "";

            const horas = Math.floor(props.duracion_minutos / 60);
            const minutos = props.duracion_minutos % 60;
            let duracionTexto = "";
            if (horas > 0) duracionTexto += `${horas}h `;
            if (minutos > 0 || horas === 0) duracionTexto += `${minutos}min`;
            document.getElementById("detalleDuracion").textContent = duracionTexto.trim();

            actualizarBotonConfirmar(props.estado);

            document.getElementById("modalDetalle").classList.add("active");

        }

        /* ============ BOTÓN CONFIRMAR (flujo WhatsApp → Confirmar) ============ */

        function actualizarBotonConfirmar(estado) {

            const btn = document.getElementById("btnConfirmarCita");
            btn.classList.remove("lista", "hecha");

            if (estado === "confirmada") {
                btn.textContent = "✓ Cita confirmada";
                btn.classList.add("hecha");
            } else {
                btn.textContent = "✓ Confirmar cita";
            }

        }

        document.getElementById("btnWhatsapp").addEventListener("click", () => {

            const btnConfirmar = document.getElementById("btnConfirmarCita");
            const props = eventoSeleccionado?.extendedProps;

            if (props && props.estado !== "confirmada") {
                btnConfirmar.classList.add("lista");
            }

        });

        document.getElementById("btnConfirmarCita").addEventListener("click", async () => {

            const btn = document.getElementById("btnConfirmarCita");
            if (btn.classList.contains("hecha")) return;

            btn.disabled = true;

            try {

                const respuesta = await fetch(`/api/admin/citas/${citaSeleccionadaId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ estado: "confirmada" }),
                });

                if (!respuesta.ok) {
                    const data = await respuesta.json().catch(() => ({}));
                    mostrarToast(data.error || "No se pudo confirmar la cita.", "error");
                    btn.disabled = false;
                    return;
                }

                document.getElementById("detalleEstado").value = "confirmada";
                document.getElementById("detalleBadge").className = "estado-badge confirmada";
                actualizarBotonConfirmar("confirmada");
                mostrarToast("Cita confirmada.", "success");
                calendar.refetchEvents();

            } catch (err) {
                mostrarToast("No se pudo confirmar la cita.", "error");
            }

            btn.disabled = false;

        });

        document.getElementById("btnCerrarDetalle").addEventListener("click", () => {
            document.getElementById("modalDetalle").classList.remove("active");
        });

        document.getElementById("btnGuardarDetalle").addEventListener("click", async () => {

            const estado = document.getElementById("detalleEstado").value;
            const notas = document.getElementById("detalleNotas").value;
            const tipo_cita = document.getElementById("detalleTipo").value;

            const respuesta = await fetch(`/api/admin/citas/${citaSeleccionadaId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ estado, notas, tipo_cita }),
            });

            if (!respuesta.ok) {
                const data = await respuesta.json();
                mostrarToast(data.error || "No se pudo guardar.", "error");
                return;
            }

            document.getElementById("modalDetalle").classList.remove("active");
            mostrarToast("Cambios guardados.", "success");
            calendar.refetchEvents();

        });

        document.getElementById("btnEliminarCita").addEventListener("click", async () => {

            if (!confirm("¿Eliminar esta cita? Esta acción no se puede deshacer.")) return;

            await fetch(`/api/admin/citas/${citaSeleccionadaId}`, { method: "DELETE" });

            document.getElementById("modalDetalle").classList.remove("active");
            mostrarToast("Cita eliminada.", "success");
            calendar.refetchEvents();

        });


        /* ============ CREAR CITA MANUAL ============ */

        function abrirCrear(fechaStr, dateObj) {

            // En vista mes, dateStr es solo la fecha (YYYY-MM-DD).
            // En vista semana/día, incluye también la hora exacta clickeada.
            const fecha = fechaStr.split("T")[0];

            const pad = (n) => String(n).padStart(2, "0");
            const tieneHora = fechaStr.includes("T");
            const hora = tieneHora
                ? `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`
                : "10:00";

            document.getElementById("crearFecha").value = fecha;
            document.getElementById("crearHora").value = hora;
            document.getElementById("crearDuracion").value = "30";
            document.getElementById("crearTipo").value = "valoracion";
            document.getElementById("crearNombre").value = "";
            document.getElementById("crearTelefono").value = "";
            document.getElementById("crearIdea").value = "";

            document.getElementById("modalCrear").classList.add("active");

        }

        document.getElementById("btnNuevaCita").addEventListener("click", () => {

            const hoy = new Date().toISOString().split("T")[0];
            abrirCrear(hoy, new Date());

        });

        document.getElementById("btnCerrarCrear").addEventListener("click", () => {
            document.getElementById("modalCrear").classList.remove("active");
        });

        document.getElementById("btnGuardarCrear").addEventListener("click", async () => {

            const nombre = document.getElementById("crearNombre").value.trim();

            if (!nombre) {
                mostrarToast("Ingresa el nombre del cliente.", "error");
                return;
            }

            const respuesta = await fetch("/api/admin/citas", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nombre_cliente: nombre,
                    telefono: document.getElementById("crearTelefono").value.trim(),
                    fecha: document.getElementById("crearFecha").value,
                    hora: document.getElementById("crearHora").value,
                    duracion_minutos: document.getElementById("crearDuracion").value,
                    tipo_cita: document.getElementById("crearTipo").value,
                    idea: document.getElementById("crearIdea").value.trim(),
                }),
            });

            const data = await respuesta.json();

            if (!respuesta.ok) {
                mostrarToast(data.error || "Ese horario choca con otra cita.", "error");
                return;
            }

            document.getElementById("modalCrear").classList.remove("active");
            mostrarToast("Cita creada.", "success");
            calendar.refetchEvents();

        });
    </script>

</body>
</html>
