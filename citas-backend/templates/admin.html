<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — Calendario de citas</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-bg-soft: #111111;
            --color-bg-light: #171717;
            --color-white: #f5f5f5;
            --color-text: #c8c8c8;
            --color-muted: #777777;
            --color-accent: #c5a46d;
            --color-green: #7fce9d;
            --color-whatsapp: #25d366;
            --font-display: "Cormorant Garamond", serif;
            --font-body: "Manrope", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-white);
            font-family: var(--font-body);
            padding: 40px 30px 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            max-width: 1100px;
            margin: 0 auto 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 40px;
            font-weight: 400;
        }

        h1 em { font-style: italic; color: var(--color-muted); }

        header p { color: var(--color-muted); font-size: 12px; margin-top: 4px; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-link {
            color: var(--color-accent);
            font-size: 11px;
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .wrap { max-width: 1100px; margin: 0 auto; }

        /* =====================================================
           TARJETAS DE RESUMEN
        ===================================================== */

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            position: relative;
            padding: 20px 22px;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: border-color 0.3s ease, transform 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .stat-card strong {
            display: block;
            font-family: var(--font-display);
            font-size: 34px;
            font-weight: 400;
            color: var(--color-white);
        }

        .stat-card span {
            display: block;
            margin-top: 4px;
            color: var(--color-muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat-card small {
            display: block;
            margin-top: 8px;
            color: var(--color-accent);
            font-size: 11px;
        }

        .stat-card.accent strong { color: var(--color-accent); }

        .stat-card.next {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .stat-card.next { grid-column: span 2; }
        }

        /* =====================================================
           LEYENDA + FILTRO
        ===================================================== */

        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
            padding: 14px 18px;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 22px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-muted);
            font-size: 11px;
            letter-spacing: 0.03em;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
            border-radius: 50%;
        }

        .legend-dot.dot-pendiente { background: var(--color-accent); }
        .legend-dot.dot-confirmada { background: var(--color-green); }
        .legend-dot.dot-cancelada { background: rgba(255, 255, 255, 0.25); }
        .legend-dot.dot-manual { background: #6c7a89; }

        .search-box {
            position: relative;
            flex-shrink: 0;
        }

        .search-box input {
            width: 220px;
            padding: 9px 14px 9px 32px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: 12px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus { border-color: var(--color-accent); }

        .search-box svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-muted);
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .search-box input { width: 100%; }
            .toolbar-row { flex-direction: column; align-items: stretch; }
        }

        /* =====================================================
           BOTONES GENERALES
        ===================================================== */

        .btn {
            padding: 12px 18px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: background 0.25s ease, color 0.25s ease, opacity 0.25s ease, transform 0.15s ease;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary { background: var(--color-white); color: var(--color-bg); }
        .btn-primary:hover { background: var(--color-accent); }

        .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: transparent;
            color: #e28f8f;
            border: 1px solid rgba(220, 80, 80, 0.4);
        }
        .btn-danger:hover { background: rgba(220, 80, 80, 0.12); }

        .btn-ghost {
            background: transparent;
            color: var(--color-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-ghost:hover { color: var(--color-white); border-color: rgba(255, 255, 255, 0.3); }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 18px;
            background: var(--color-whatsapp);
            color: #fff;
            text-decoration: none;
        }
        .btn-whatsapp:hover { background: #1ebd5a; }

        .btn-confirm {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 18px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--color-muted);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm.ready {
            background: rgba(197, 164, 109, 0.12);
            color: var(--color-accent);
            border: 1px solid var(--color-accent);
        }

        .btn-confirm.ready:hover {
            background: var(--color-accent);
            color: var(--color-bg);
        }

        .btn-confirm.done {
            background: rgba(127, 206, 157, 0.12);
            color: var(--color-green);
            border: 1px solid var(--color-green);
            cursor: default;
        }

        /* =====================================================
           OVERRIDES DE FULLCALENDAR PARA TEMA OSCURO
        ===================================================== */

        #calendar {
            --fc-border-color: rgba(255, 255, 255, 0.1);
            --fc-page-bg-color: var(--color-bg-soft);
            --fc-neutral-bg-color: var(--color-bg-light);
            --fc-list-event-hover-bg-color: var(--color-bg-light);
            --fc-today-bg-color: rgba(197, 164, 109, 0.08);
            --fc-event-bg-color: var(--color-accent);
            --fc-event-border-color: var(--color-accent);
            --fc-event-text-color: var(--color-bg);
            --fc-button-bg-color: var(--color-bg-light);
            --fc-button-border-color: rgba(255, 255, 255, 0.15);
            --fc-button-hover-bg-color: var(--color-accent);
            --fc-button-hover-border-color: var(--color-accent);
            --fc-button-active-bg-color: var(--color-accent);
            --fc-button-text-color: var(--color-white);
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            font-size: 13px;
        }

        #calendar .fc-toolbar-title {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 24px;
            color: var(--color-white);
            text-transform: capitalize;
        }

        #calendar .fc-col-header-cell-cushion,
        #calendar .fc-daygrid-day-number {
            color: var(--color-text);
            text-decoration: none;
        }

        #calendar .fc-button {
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.05em;
            font-weight: 600;
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        #calendar .fc-daygrid-day:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        #calendar .fc-day-today {
            box-shadow: inset 0 0 0 1px rgba(197, 164, 109, 0.4);
        }

        #calendar .fc-event {
            cursor: pointer;
            font-size: 11px;
            padding: 1px 3px;
            border-radius: 0;
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        #calendar .fc-event:hover {
            filter: brightness(1.12);
        }

        .fc-event-manual {
            --fc-event-bg-color: #6c7a89 !important;
            --fc-event-border-color: #6c7a89 !important;
        }

        .fc-event-cancelada {
            --fc-event-bg-color: rgba(255, 255, 255, 0.15) !important;
            --fc-event-border-color: rgba(255, 255, 255, 0.15) !important;
            text-decoration: line-through;
        }

        .fc-event-confirmada {
            --fc-event-bg-color: var(--color-green) !important;
            --fc-event-border-color: var(--color-green) !important;
        }

        .fc-event-nuevo .fc-event-main::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 4px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.35);
        }

        .fc-event-wa-icon {
            display: inline-flex;
            align-items: center;
            margin-right: 3px;
            transform: translateY(1px);
        }

        .fc-event-dim {
            opacity: 0.18;
        }

        /* Tooltip */
        .fc-tooltip {
            position: fixed;
            z-index: 3000;
            padding: 8px 12px;
            background: #1c1c1c;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-white);
            font-size: 11px;
            line-height: 1.6;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            max-width: 220px;
        }

        .fc-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .fc-tooltip strong { color: var(--color-accent); font-weight: 600; }

        /* =====================================================
           MODAL
        ===================================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            width: min(90%, 440px);
            max-height: 85vh;
            overflow-y: auto;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px;
            opacity: 0;
            transform: scale(0.96) translateY(8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .modal-overlay.active .modal-box {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .modal-box h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .status-badge {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-badge.badge-pendiente { background: var(--color-accent); }
        .status-badge.badge-confirmada { background: var(--color-green); }
        .status-badge.badge-cancelada { background: rgba(255, 255, 255, 0.3); }

        .modal-subhead {
            display: block;
            margin-bottom: 20px;
            padding-bottom: 20px;
            color: var(--color-muted);
            font-size: 11px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-subhead .time-until {
            color: var(--color-accent);
        }

        .modal-row { margin-bottom: 18px; }

        .modal-row label {
            display: block;
            margin-bottom: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-muted);
        }

        .modal-row p,
        .modal-row a {
            font-size: 14px;
            color: var(--color-white);
            text-decoration: none;
        }

        .modal-row a { color: var(--color-accent); }

        .modal-row input,
        .modal-row select,
        .modal-row textarea {
            width: 100%;
            padding: 10px 12px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: 13px;
            outline: none;
        }

        .modal-row input:focus,
        .modal-row select:focus,
        .modal-row textarea:focus {
            border-color: var(--color-accent);
        }

        .modal-row select { cursor: pointer; }
        .modal-row textarea { resize: vertical; min-height: 60px; }

        .contact-block {
            margin-bottom: 24px;
            padding-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* =====================================================
           TOASTS
        ===================================================== */

        .toast-stack {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            min-width: 240px;
            max-width: 340px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 3px solid var(--color-accent);
            color: var(--color-white);
            font-size: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.toast-success { border-left-color: var(--color-green); }
        .toast.toast-error { border-left-color: #e28f8f; }

        @media (max-width: 600px) {

            .stats-row {
                grid-template-columns: 1fr;
            }

            .stat-card.next { grid-column: span 1; }

            .legend-row {
                gap: 14px;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .toast-stack {
                left: 16px;
                right: 16px;
                bottom: 16px;
            }

            .toast { max-width: none; }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Panel de <em>citas.</em></h1>
            <p>Sesión: {{ usuario }}</p>
        </div>

        <div class="header-right">
            <button class="btn btn-primary" id="btnNuevaCita">+ Nueva cita</button>
            <a class="logout-link" href="{{ url_for('logout') }}">Cerrar sesión →</a>
        </div>
    </header>

    <div class="wrap">

        <div class="stats-row">
            <div class="stat-card accent">
                <strong id="statHoy">0</strong>
                <span>Citas hoy</span>
            </div>
            <div class="stat-card">
                <strong id="statPendientes">0</strong>
                <span>Pendientes</span>
            </div>
            <div class="stat-card">
                <strong id="statConfirmadas">0</strong>
                <span>Confirmadas</span>
            </div>
            <div class="stat-card next">
                <span>Próxima cita</span>
                <strong id="statProxima" style="font-size: 20px; margin-top: 6px;">—</strong>
                <small id="statProximaSub"></small>
            </div>
        </div>

        <div class="toolbar-row">

            <div class="legend-row">
                <div class="legend-item"><span class="legend-dot dot-pendiente"></span> Pendiente</div>
                <div class="legend-item"><span class="legend-dot dot-confirmada"></span> Confirmada</div>
                <div class="legend-item"><span class="legend-dot dot-cancelada"></span> Cancelada</div>
                <div class="legend-item"><span class="legend-dot dot-manual"></span> Creada manualmente</div>
            </div>

            <div class="search-box">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.3-4.3"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar por nombre...">
            </div>

        </div>

        <div id="calendar"></div>
    </div>


    <!-- ============ MODAL: DETALLE DE CITA ============ -->

    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-box">

            <h2><span class="status-badge" id="detalleBadge"></span><span id="detalleNombreTitulo"></span></h2>
            <span class="modal-subhead" id="detalleSubhead"></span>

            <div class="contact-block">
                <a class="btn-whatsapp" id="btnContactarWpp" href="#" target="_blank">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 5L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.11c-1.49 0-2.95-.4-4.24-1.16l-.3-.18-3.12.82.83-3.04-.2-.31a8.24 8.24 0 0 1-1.28-4.39c0-4.54 3.7-8.24 8.24-8.24 4.53 0 8.23 3.7 8.23 8.24 0 4.54-3.7 8.26-8.24 8.26zm4.52-6.19c-.25-.12-1.47-.72-1.69-.8-.23-.08-.39-.12-.56.12-.17.25-.64.8-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.42-.14-.01-.31-.01-.48-.01-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.06 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.25 3.74.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.14-1.18-.06-.11-.23-.17-.48-.29z"/>
                    </svg>
                    Contactar por WhatsApp
                </a>

                <button type="button" class="btn-confirm" id="btnConfirmarCita">
                    <span id="confirmIcon">○</span>
                    <span id="confirmLabel">Confirmar cita (contacta primero)</span>
                </button>
            </div>

            <div class="modal-row">
                <label>Correo</label>
                <p id="detalleEmail"></p>
            </div>

            <div class="modal-row">
                <label>Duración</label>
                <p id="detalleDuracion"></p>
            </div>

            <div class="modal-row">
                <label>Tipo de cita</label>
                <select id="detalleTipo">
                    <option value="valoracion">Valoración</option>
                    <option value="tatuaje">Tatuaje</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Idea del tatuaje</label>
                <p id="detalleIdea"></p>
            </div>

            <div class="modal-row">
                <label>Estado</label>
                <select id="detalleEstado">
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmada">Confirmada</option>
                    <option value="cancelada">Cancelada</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Notas internas</label>
                <textarea id="detalleNotas" placeholder="Notas privadas sobre esta cita..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-danger" id="btnEliminarCita">Eliminar</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-ghost" id="btnCerrarDetalle">Cerrar</button>
                    <button class="btn btn-primary" id="btnGuardarDetalle">Guardar</button>
                </div>
            </div>

        </div>
    </div>


    <!-- ============ MODAL: CREAR CITA MANUAL ============ -->

    <div class="modal-overlay" id="modalCrear">
        <div class="modal-box">

            <h2>Nueva cita manual</h2>

            <div class="modal-row">
                <label>Fecha</label>
                <input type="date" id="crearFecha">
            </div>

            <div class="modal-row">
                <label>Hora</label>
                <input type="time" id="crearHora" min="10:00" max="19:00" step="1800">
            </div>

            <div class="modal-row">
                <label>Duración</label>
                <select id="crearDuracion">
                    <option value="30">30 minutos</option>
                    <option value="60">1 hora</option>
                    <option value="90">1 hora 30 min</option>
                    <option value="120">2 horas</option>
                    <option value="180">3 horas</option>
                    <option value="240">4 horas</option>
                    <option value="300">5 horas</option>
                    <option value="360">6 horas</option>
                    <option value="420">7 horas</option>
                    <option value="480">8 horas (jornada completa)</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Tipo de cita</label>
                <select id="crearTipo">
                    <option value="valoracion">Valoración</option>
                    <option value="tatuaje">Tatuaje</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Nombre del cliente *</label>
                <input type="text" id="crearNombre" placeholder="Nombre completo">
            </div>

            <div class="modal-row">
                <label>WhatsApp</label>
                <input type="tel" id="crearTelefono" placeholder="300 123 4567">
            </div>

            <div class="modal-row">
                <label>Idea / notas</label>
                <textarea id="crearIdea" placeholder="¿Qué se va a tatuar?"></textarea>
            </div>

            <div class="modal-actions">
                <div></div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-ghost" id="btnCerrarCrear">Cancelar</button>
                    <button class="btn btn-primary" id="btnGuardarCrear">Crear cita</button>
                </div>
            </div>

        </div>
    </div>


    <div class="toast-stack" id="toastStack"></div>


    <script>

        /* =====================================================
           TOASTS
        ===================================================== */

        function toast(mensaje, tipo = "info") {

            const stack = document.getElementById("toastStack");
            const el = document.createElement("div");
            el.className = `toast toast-${tipo}`;
            el.textContent = mensaje;

            stack.appendChild(el);

            requestAnimationFrame(() => el.classList.add("visible"));

            setTimeout(() => {
                el.classList.remove("visible");
                setTimeout(() => el.remove(), 300);
            }, 3800);

        }

        /* =====================================================
           CONTACTOS YA HECHOS / CITAS VISTAS (localStorage)
        ===================================================== */

        const LS_CONTACTADAS = "inkora_contactadas";
        const LS_VISTAS = "inkora_citas_vistas";

        function leerSet(clave) {
            try {
                return new Set(JSON.parse(localStorage.getItem(clave) || "[]"));
            } catch {
                return new Set();
            }
        }

        function guardarSet(clave, set) {
            localStorage.setItem(clave, JSON.stringify([...set]));
        }

        let contactadas = leerSet(LS_CONTACTADAS);
        let vistas = leerSet(LS_VISTAS);

        /* =====================================================
           ANIMACIÓN DE CONTEO
        ===================================================== */

        function animarNumero(el, valorFinal) {

            const inicio = Number(el.textContent) || 0;
            if (inicio === valorFinal) { el.textContent = valorFinal; return; }

            const duracion = 500;
            const t0 = performance.now();

            function paso(t) {
                const progreso = Math.min((t - t0) / duracion, 1);
                const valor = Math.round(inicio + (valorFinal - inicio) * progreso);
                el.textContent = valor;
                if (progreso < 1) requestAnimationFrame(paso);
            }

            requestAnimationFrame(paso);

        }

        /* =====================================================
           CALENDARIO
        ===================================================== */

        let citaSeleccionadaId = null;
        let citaSeleccionadaEvent = null;
        let todosLosEventos = [];
        let filtroTexto = "";

        const calendarEl = document.getElementById("calendar");

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth",
            locale: "es",
            height: "auto",
            firstDay: 1,
            editable: true,
            eventStartEditable: true,
            eventDurationEditable: false,
            headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek,timeGridDay",
            },
            buttonText: {
                today: "Hoy",
                month: "Mes",
                week: "Semana",
                day: "Día",
            },

            slotMinTime: "10:00:00",
            slotMaxTime: "19:00:00",
            slotDuration: "00:30:00",
            allDaySlot: false,
            nowIndicator: true,

            events: "/api/admin/citas",

            eventClassNames(arg) {
                const props = arg.event.extendedProps;
                const clases = [];

                if (props.estado === "cancelada") clases.push("fc-event-cancelada");
                else if (props.estado === "confirmada") clases.push("fc-event-confirmada");
                else if (!props.creada_por_cliente) clases.push("fc-event-manual");

                if (props.estado === "pendiente" && props.creada_por_cliente && !vistas.has(String(arg.event.id))) {
                    clases.push("fc-event-nuevo");
                }

                if (filtroTexto && !arg.event.title.toLowerCase().includes(filtroTexto)) {
                    clases.push("fc-event-dim");
                }

                return clases;
            },

            eventContent(arg) {

                const props = arg.event.extendedProps;
                const wrap = document.createElement("div");
                wrap.style.display = "flex";
                wrap.style.alignItems = "center";
                wrap.style.overflow = "hidden";

                if (props.estado === "pendiente") {
                    const icon = document.createElement("span");
                    icon.className = "fc-event-wa-icon";
                    icon.innerHTML = `<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 5L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2z"/></svg>`;
                    wrap.appendChild(icon);
                }

                const label = document.createElement("span");
                label.style.overflow = "hidden";
                label.style.textOverflow = "ellipsis";
                label.style.whiteSpace = "nowrap";
                label.textContent = (arg.timeText ? arg.timeText + " " : "") + arg.event.title;
                wrap.appendChild(label);

                return { domNodes: [wrap] };

            },

            eventClick(info) {
                marcarVista(info.event.id);
                abrirDetalle(info.event);
            },

            dateClick(info) {
                abrirCrear(info.dateStr, info.date);
            },

            eventDrop(info) {
                reagendarCita(info.event, info.revert);
            },

            eventDidMount(info) {
                adjuntarTooltip(info.event, info.el);
            },

            eventsSet(events) {
                todosLosEventos = events;
                actualizarResumen(events);
            },
        });

        calendar.render();

        function marcarVista(id) {
            vistas.add(String(id));
            guardarSet(LS_VISTAS, vistas);
        }

        async function reagendarCita(event, revertFn) {

            const fecha = event.start.toISOString().split("T")[0];
            const pad = (n) => String(n).padStart(2, "0");
            const hora = `${pad(event.start.getHours())}:${pad(event.start.getMinutes())}`;

            try {

                const respuesta = await fetch(`/api/admin/citas/${event.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ fecha, hora }),
                });

                if (!respuesta.ok) {
                    const data = await respuesta.json();
                    toast(data.error || "No se pudo mover la cita.", "error");
                    revertFn();
                    return;
                }

                toast(`Cita movida a ${fecha} ${hora}.`, "success");
                calendar.refetchEvents();

            } catch (e) {
                toast("Error de conexión al mover la cita.", "error");
                revertFn();
            }

        }

        /* =====================================================
           TOOLTIP
        ===================================================== */

        let tooltipEl = null;

        function adjuntarTooltip(event, el) {

            el.addEventListener("mouseenter", () => {

                if (!tooltipEl) {
                    tooltipEl = document.createElement("div");
                    tooltipEl.className = "fc-tooltip";
                    document.body.appendChild(tooltipEl);
                }

                const props = event.extendedProps;
                const hora = event.start.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
                const tipoTexto = props.tipo_cita === "tatuaje" ? "Tatuaje" : "Valoración";

                tooltipEl.innerHTML = `<strong>${event.title}</strong><br>${hora} · ${tipoTexto}`;

                const rect = el.getBoundingClientRect();
                tooltipEl.style.left = `${rect.left}px`;
                tooltipEl.style.top = `${rect.bottom + 8}px`;

                requestAnimationFrame(() => tooltipEl.classList.add("visible"));

            });

            el.addEventListener("mouseleave", () => {
                if (tooltipEl) tooltipEl.classList.remove("visible");
            });

        }

        /* =====================================================
           BÚSQUEDA / FILTRO
        ===================================================== */

        document.getElementById("searchInput").addEventListener("input", (e) => {
            filtroTexto = e.target.value.trim().toLowerCase();
            calendar.render();
        });

        /* =====================================================
           TARJETAS DE RESUMEN
        ===================================================== */

        function actualizarResumen(events) {

            const hoy = new Date().toISOString().split("T")[0];
            const ahora = new Date();

            let citasHoy = 0;
            let pendientes = 0;
            let confirmadas = 0;
            let proxima = null;

            events.forEach(event => {

                const fechaEvento = event.startStr.split("T")[0];
                const estado = event.extendedProps.estado;

                if (fechaEvento === hoy) citasHoy++;
                if (estado === "pendiente") pendientes++;
                if (estado === "confirmada") confirmadas++;

                if (estado !== "cancelada" && event.start > ahora) {
                    if (!proxima || event.start < proxima.start) proxima = event;
                }

            });

            animarNumero(document.getElementById("statHoy"), citasHoy);
            animarNumero(document.getElementById("statPendientes"), pendientes);
            animarNumero(document.getElementById("statConfirmadas"), confirmadas);

            const statProxima = document.getElementById("statProxima");
            const statProximaSub = document.getElementById("statProximaSub");

            if (proxima) {
                statProxima.textContent = proxima.title;
                statProximaSub.textContent = formatearTiempoRelativo(proxima.start);
            } else {
                statProxima.textContent = "—";
                statProximaSub.textContent = "No hay citas próximas";
            }

        }

        function formatearTiempoRelativo(fecha) {

            const ahora = new Date();
            const diffMs = fecha - ahora;
            const diffMin = Math.round(diffMs / 60000);
            const diffHoras = Math.round(diffMin / 60);
            const diffDias = Math.round(diffHoras / 24);

            const hora = fecha.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });

            if (diffMin < 60) return `en ${diffMin} min · ${hora}`;
            if (diffHoras < 24 && fecha.toDateString() === ahora.toDateString()) return `hoy a las ${hora}`;

            const manana = new Date(ahora);
            manana.setDate(manana.getDate() + 1);
            if (fecha.toDateString() === manana.toDateString()) return `mañana a las ${hora}`;

            if (diffDias < 7) return `en ${diffDias} días · ${hora}`;

            return `${fecha.toLocaleDateString("es-CO", { day: "numeric", month: "long" })} · ${hora}`;

        }

        /* =====================================================
           DETALLE DE CITA
        ===================================================== */

        function abrirDetalle(event) {

            citaSeleccionadaId = event.id;
            citaSeleccionadaEvent = event;
            const props = event.extendedProps;

            document.getElementById("detalleNombreTitulo").textContent = event.title;

            const badge = document.getElementById("detalleBadge");
            badge.className = `status-badge badge-${props.estado || "pendiente"}`;

            const fecha = new Date(event.start);
            const fechaTexto = fecha.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
            const horaTexto = fecha.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });

            document.getElementById("detalleSubhead").innerHTML =
                `${fechaTexto} · ${horaTexto} &nbsp;·&nbsp; <span class="time-until">${formatearTiempoRelativo(fecha)}</span>`;

            document.getElementById("detalleEmail").textContent = props.email || "—";
            document.getElementById("detalleIdea").textContent = props.idea || "—";
            document.getElementById("detalleEstado").value = props.estado || "pendiente";
            document.getElementById("detalleTipo").value = props.tipo_cita || "valoracion";
            document.getElementById("detalleNotas").value = props.notas || "";

            const horas = Math.floor(props.duracion_minutos / 60);
            const minutos = props.duracion_minutos % 60;
            let duracionTexto = "";
            if (horas > 0) duracionTexto += `${horas}h `;
            if (minutos > 0 || horas === 0) duracionTexto += `${minutos}min`;
            document.getElementById("detalleDuracion").textContent = duracionTexto.trim();

            // ---- Botón de WhatsApp ----
            const wppBtn = document.getElementById("btnContactarWpp");
            const telLimpio = (props.telefono || "").replace(/\D/g, "");

            if (telLimpio) {

                const tipoTexto = props.tipo_cita === "tatuaje" ? "tu sesión de tatuaje" : "tu valoración";
                const mensaje =
                    `Hola ${event.title}, te escribo de Daniel Tatto Ink para confirmar ${tipoTexto} ` +
                    `el ${fechaTexto} a las ${horaTexto}. ¿Se te sigue facilitando ese horario?`;

                wppBtn.href = `https://wa.me/${telLimpio}?text=${encodeURIComponent(mensaje)}`;
                wppBtn.style.pointerEvents = "auto";
                wppBtn.style.opacity = "1";

            } else {
                wppBtn.href = "#";
                wppBtn.style.pointerEvents = "none";
                wppBtn.style.opacity = "0.4";
            }

            wppBtn.onclick = () => {
                if (!telLimpio) return;
                contactadas.add(String(event.id));
                guardarSet(LS_CONTACTADAS, contactadas);
                actualizarBotonConfirmar(props.estado);
            };

            actualizarBotonConfirmar(props.estado);

            document.getElementById("modalDetalle").classList.add("active");

        }

        function actualizarBotonConfirmar(estadoActual) {

            const btn = document.getElementById("btnConfirmarCita");
            const icon = document.getElementById("confirmIcon");
            const label = document.getElementById("confirmLabel");

            const yaContactado = contactadas.has(String(citaSeleccionadaId));

            btn.classList.remove("ready", "done");

            if (estadoActual === "confirmada") {
                btn.classList.add("done");
                icon.textContent = "✓";
                label.textContent = "Cita confirmada";
            } else if (yaContactado) {
                btn.classList.add("ready");
                icon.textContent = "○";
                label.textContent = "Confirmar cita";
            } else {
                icon.textContent = "○";
                label.textContent = "Confirmar cita (contacta primero)";
            }

        }

        document.getElementById("btnConfirmarCita").addEventListener("click", async () => {

            const btn = document.getElementById("btnConfirmarCita");
            if (btn.classList.contains("done")) return;

            if (!contactadas.has(String(citaSeleccionadaId))) {
                toast("Contacta al cliente por WhatsApp antes de confirmar.", "error");
                return;
            }

            document.getElementById("detalleEstado").value = "confirmada";

            try {

                const respuesta = await fetch(`/api/admin/citas/${citaSeleccionadaId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ estado: "confirmada" }),
                });

                if (!respuesta.ok) {
                    const data = await respuesta.json();
                    toast(data.error || "No se pudo confirmar.", "error");
                    return;
                }

                actualizarBotonConfirmar("confirmada");
                document.getElementById("detalleBadge").className = "status-badge badge-confirmada";
                toast("Cita confirmada.", "success");
                calendar.refetchEvents();

            } catch (e) {
                toast("Error de conexión al confirmar.", "error");
            }

        });

        document.getElementById("btnCerrarDetalle").addEventListener("click", () => {
            document.getElementById("modalDetalle").classList.remove("active");
        });

        document.getElementById("modalDetalle").addEventListener("click", (e) => {
            if (e.target.id === "modalDetalle") e.currentTarget.classList.remove("active");
        });

        document.getElementById("btnGuardarDetalle").addEventListener("click", async () => {

            const estado = document.getElementById("detalleEstado").value;
            const notas = document.getElementById("detalleNotas").value;
            const tipo_cita = document.getElementById("detalleTipo").value;

            try {

                const respuesta = await fetch(`/api/admin/citas/${citaSeleccionadaId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ estado, notas, tipo_cita }),
                });

                if (!respuesta.ok) {
                    const data = await respuesta.json();
                    toast(data.error || "No se pudo guardar.", "error");
                    return;
                }

                document.getElementById("modalDetalle").classList.remove("active");
                toast("Cambios guardados.", "success");
                calendar.refetchEvents();

            } catch (e) {
                toast("Error de conexión al guardar.", "error");
            }

        });

        document.getElementById("btnEliminarCita").addEventListener("click", async () => {

            if (!confirm("¿Eliminar esta cita? Esta acción no se puede deshacer.")) return;

            try {

                await fetch(`/api/admin/citas/${citaSeleccionadaId}`, { method: "DELETE" });

                document.getElementById("modalDetalle").classList.remove("active");
                toast("Cita eliminada.", "success");
                calendar.refetchEvents();

            } catch (e) {
                toast("Error de conexión al eliminar.", "error");
            }

        });


        /* =====================================================
           CREAR CITA MANUAL
        ===================================================== */

        function abrirCrear(fechaStr, dateObj) {

            const fecha = fechaStr.split("T")[0];

            const pad = (n) => String(n).padStart(2, "0");
            const tieneHora = fechaStr.includes("T");
            const hora = tieneHora
                ? `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`
                : "10:00";

            document.getElementById("crearFecha").value = fecha;
            document.getElementById("crearHora").value = hora;
            document.getElementById("crearDuracion").value = "30";
            document.getElementById("crearTipo").value = "valoracion";
            document.getElementById("crearNombre").value = "";
            document.getElementById("crearTelefono").value = "";
            document.getElementById("crearIdea").value = "";

            document.getElementById("modalCrear").classList.add("active");

        }

        document.getElementById("btnNuevaCita").addEventListener("click", () => {

            const hoy = new Date().toISOString().split("T")[0];
            abrirCrear(hoy, new Date());

        });

        document.getElementById("btnCerrarCrear").addEventListener("click", () => {
            document.getElementById("modalCrear").classList.remove("active");
        });

        document.getElementById("modalCrear").addEventListener("click", (e) => {
            if (e.target.id === "modalCrear") e.currentTarget.classList.remove("active");
        });

        document.getElementById("btnGuardarCrear").addEventListener("click", async () => {

            const nombre = document.getElementById("crearNombre").value.trim();

            if (!nombre) {
                toast("Ingresa el nombre del cliente.", "error");
                return;
            }

            try {

                const respuesta = await fetch("/api/admin/citas", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nombre_cliente: nombre,
                        telefono: document.getElementById("crearTelefono").value.trim(),
                        fecha: document.getElementById("crearFecha").value,
                        hora: document.getElementById("crearHora").value,
                        duracion_minutos: document.getElementById("crearDuracion").value,
                        tipo_cita: document.getElementById("crearTipo").value,
                        idea: document.getElementById("crearIdea").value.trim(),
                    }),
                });

                const data = await respuesta.json();

                if (!respuesta.ok) {
                    toast(data.error || "Ese horario choca con otra cita.", "error");
                    return;
                }

                document.getElementById("modalCrear").classList.remove("active");
                toast("Cita creada.", "success");
                calendar.refetchEvents();

            } catch (e) {
                toast("Error de conexión al crear la cita.", "error");
            }

        });

    </script>

</body>
</html>
