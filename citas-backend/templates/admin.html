<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — Calendario de citas</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-bg-soft: #111111;
            --color-bg-light: #171717;
            --color-white: #f5f5f5;
            --color-text: #c8c8c8;
            --color-muted: #777777;
            --color-accent: #c5a46d;
            --font-display: "Cormorant Garamond", serif;
            --font-body: "Manrope", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-white);
            font-family: var(--font-body);
            padding: 40px 30px 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            max-width: 1100px;
            margin: 0 auto 35px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 40px;
            font-weight: 400;
        }

        h1 em { font-style: italic; color: var(--color-muted); }

        header p { color: var(--color-muted); font-size: 12px; margin-top: 4px; }

        header a {
            color: var(--color-accent);
            font-size: 11px;
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .wrap { max-width: 1100px; margin: 0 auto; }

        /* =====================================================
           OVERRIDES DE FULLCALENDAR PARA TEMA OSCURO
        ===================================================== */

        #calendar {
            --fc-border-color: rgba(255, 255, 255, 0.1);
            --fc-page-bg-color: var(--color-bg-soft);
            --fc-neutral-bg-color: var(--color-bg-light);
            --fc-list-event-hover-bg-color: var(--color-bg-light);
            --fc-today-bg-color: rgba(197, 164, 109, 0.08);
            --fc-event-bg-color: var(--color-accent);
            --fc-event-border-color: var(--color-accent);
            --fc-event-text-color: var(--color-bg);
            --fc-button-bg-color: var(--color-bg-light);
            --fc-button-border-color: rgba(255, 255, 255, 0.15);
            --fc-button-hover-bg-color: var(--color-accent);
            --fc-button-hover-border-color: var(--color-accent);
            --fc-button-active-bg-color: var(--color-accent);
            --fc-button-text-color: var(--color-white);
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            font-size: 13px;
        }

        #calendar .fc-toolbar-title {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 24px;
            color: var(--color-white);
        }

        #calendar .fc-col-header-cell-cushion,
        #calendar .fc-daygrid-day-number {
            color: var(--color-text);
            text-decoration: none;
        }

        #calendar .fc-button {
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.05em;
            font-weight: 600;
            box-shadow: none !important;
        }

        #calendar .fc-event {
            cursor: pointer;
            font-size: 11px;
            padding: 1px 3px;
        }

        .fc-event-manual {
            --fc-event-bg-color: #6c7a89 !important;
            --fc-event-border-color: #6c7a89 !important;
        }

        .fc-event-cancelada {
            --fc-event-bg-color: rgba(255, 255, 255, 0.15) !important;
            --fc-event-border-color: rgba(255, 255, 255, 0.15) !important;
            text-decoration: line-through;
        }

        .fc-event-confirmada {
            --fc-event-bg-color: #7fce9d !important;
            --fc-event-border-color: #7fce9d !important;
        }

        /* =====================================================
           MODAL
        ===================================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            width: min(90%, 440px);
            max-height: 85vh;
            overflow-y: auto;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px;
        }

        .modal-box h2 {
            font-family: var(--font-display);
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 25px;
        }

        .modal-row { margin-bottom: 18px; }

        .modal-row label {
            display: block;
            margin-bottom: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-muted);
        }

        .modal-row p,
        .modal-row a {
            font-size: 14px;
            color: var(--color-white);
            text-decoration: none;
        }

        .modal-row a { color: var(--color-accent); }

        .modal-row input,
        .modal-row select,
        .modal-row textarea {
            width: 100%;
            padding: 10px 12px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: 13px;
            outline: none;
        }

        .modal-row select { cursor: pointer; }
        .modal-row textarea { resize: vertical; min-height: 60px; }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
        }

        .btn {
            padding: 12px 18px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background: var(--color-white); color: var(--color-bg); }
        .btn-primary:hover { background: var(--color-accent); }

        .btn-danger {
            background: transparent;
            color: #e28f8f;
            border: 1px solid rgba(220, 80, 80, 0.4);
        }
        .btn-danger:hover { background: rgba(220, 80, 80, 0.12); }

        .btn-ghost {
            background: transparent;
            color: var(--color-muted);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-ghost:hover { color: var(--color-white); border-color: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Panel de <em>citas.</em></h1>
            <p>Sesión: {{ usuario }}</p>
        </div>
        <a href="{{ url_for('logout') }}">Cerrar sesión →</a>
    </header>

    <div class="wrap">
        <div id="calendar"></div>
    </div>


    <!-- ============ MODAL: DETALLE DE CITA ============ -->

    <div class="modal-overlay" id="modalDetalle">
        <div class="modal-box">

            <h2>Detalle de la cita</h2>

            <div class="modal-row">
                <label>Cliente</label>
                <p id="detalleNombre"></p>
            </div>

            <div class="modal-row">
                <label>WhatsApp</label>
                <a id="detalleTelefono" href="#" target="_blank"></a>
            </div>

            <div class="modal-row">
                <label>Correo</label>
                <p id="detalleEmail"></p>
            </div>

            <div class="modal-row">
                <label>Fecha y hora</label>
                <p id="detalleFechaHora"></p>
            </div>

            <div class="modal-row">
                <label>Duración</label>
                <p id="detalleDuracion"></p>
            </div>

            <div class="modal-row">
                <label>Tipo de cita</label>
                <select id="detalleTipo">
                    <option value="valoracion">Valoración</option>
                    <option value="tatuaje">Tatuaje</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Idea del tatuaje</label>
                <p id="detalleIdea"></p>
            </div>

            <div class="modal-row">
                <label>Estado</label>
                <select id="detalleEstado">
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmada">Confirmada</option>
                    <option value="cancelada">Cancelada</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Notas internas</label>
                <textarea id="detalleNotas" placeholder="Notas privadas sobre esta cita..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-danger" id="btnEliminarCita">Eliminar</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-ghost" id="btnCerrarDetalle">Cerrar</button>
                    <button class="btn btn-primary" id="btnGuardarDetalle">Guardar</button>
                </div>
            </div>

        </div>
    </div>


    <!-- ============ MODAL: CREAR CITA MANUAL ============ -->

    <div class="modal-overlay" id="modalCrear">
        <div class="modal-box">

            <h2>Nueva cita manual</h2>

            <div class="modal-row">
                <label>Fecha</label>
                <input type="date" id="crearFecha">
            </div>

            <div class="modal-row">
                <label>Hora</label>
                <input type="time" id="crearHora">
            </div>

            <div class="modal-row">
                <label>Duración</label>
                <select id="crearDuracion">
                    <option value="30">30 minutos</option>
                    <option value="60">1 hora</option>
                    <option value="90">1 hora 30 min</option>
                    <option value="120">2 horas</option>
                    <option value="180">3 horas</option>
                    <option value="240">4 horas</option>
                    <option value="300">5 horas</option>
                    <option value="360">6 horas</option>
                    <option value="420">7 horas</option>
                    <option value="480">8 horas (jornada completa)</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Tipo de cita</label>
                <select id="crearTipo">
                    <option value="valoracion">Valoración</option>
                    <option value="tatuaje">Tatuaje</option>
                </select>
            </div>

            <div class="modal-row">
                <label>Nombre del cliente *</label>
                <input type="text" id="crearNombre" placeholder="Nombre completo">
            </div>

            <div class="modal-row">
                <label>WhatsApp</label>
                <input type="tel" id="crearTelefono" placeholder="300 123 4567">
            </div>

            <div class="modal-row">
                <label>Idea / notas</label>
                <textarea id="crearIdea" placeholder="¿Qué se va a tatuar?"></textarea>
            </div>

            <div class="modal-actions">
                <div></div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-ghost" id="btnCerrarCrear">Cancelar</button>
                    <button class="btn btn-primary" id="btnGuardarCrear">Crear cita</button>
                </div>
            </div>

        </div>
    </div>


    <script>
        let citaSeleccionadaId = null;

        const calendarEl = document.getElementById("calendar");

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: "dayGridMonth",
            locale: "es",
            height: "auto",
            headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek,timeGridDay",
            },
            buttonText: {
                today: "Hoy",
                month: "Mes",
                week: "Semana",
                day: "Día",
            },
            events: "/api/admin/citas",

            eventClassNames(arg) {
                const props = arg.event.extendedProps;
                if (props.estado === "cancelada") return ["fc-event-cancelada"];
                if (props.estado === "confirmada") return ["fc-event-confirmada"];
                if (!props.creada_por_cliente) return ["fc-event-manual"];
                return [];
            },

            eventClick(info) {
                abrirDetalle(info.event);
            },

            dateClick(info) {
                abrirCrear(info.dateStr, info.date);
            },
        });

        calendar.render();


        /* ============ DETALLE DE CITA ============ */

        function abrirDetalle(event) {

            citaSeleccionadaId = event.id;
            const props = event.extendedProps;

            document.getElementById("detalleNombre").textContent = event.title;

            const telLink = document.getElementById("detalleTelefono");
            const telLimpio = (props.telefono || "").replace(/\D/g, "");
            telLink.textContent = props.telefono || "—";
            telLink.href = telLimpio ? `https://wa.me/${telLimpio}` : "#";

            document.getElementById("detalleEmail").textContent = props.email || "—";

            const fecha = new Date(event.start);
            document.getElementById("detalleFechaHora").textContent =
                fecha.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" }) +
                " · " +
                fecha.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });

            document.getElementById("detalleIdea").textContent = props.idea || "—";
            document.getElementById("detalleEstado").value = props.estado || "pendiente";
            document.getElementById("detalleTipo").value = props.tipo_cita || "valoracion";
            document.getElementById("detalleNotas").value = props.notas || "";

            const horas = Math.floor(props.duracion_minutos / 60);
            const minutos = props.duracion_minutos % 60;
            let duracionTexto = "";
            if (horas > 0) duracionTexto += `${horas}h `;
            if (minutos > 0 || horas === 0) duracionTexto += `${minutos}min`;
            document.getElementById("detalleDuracion").textContent = duracionTexto.trim();

            document.getElementById("modalDetalle").classList.add("active");

        }

        document.getElementById("btnCerrarDetalle").addEventListener("click", () => {
            document.getElementById("modalDetalle").classList.remove("active");
        });

        document.getElementById("btnGuardarDetalle").addEventListener("click", async () => {

            const estado = document.getElementById("detalleEstado").value;
            const notas = document.getElementById("detalleNotas").value;
            const tipo_cita = document.getElementById("detalleTipo").value;

            const respuesta = await fetch(`/api/admin/citas/${citaSeleccionadaId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ estado, notas, tipo_cita }),
            });

            if (!respuesta.ok) {
                const data = await respuesta.json();
                alert(data.error || "No se pudo guardar.");
                return;
            }

            document.getElementById("modalDetalle").classList.remove("active");
            calendar.refetchEvents();

        });

        document.getElementById("btnEliminarCita").addEventListener("click", async () => {

            if (!confirm("¿Eliminar esta cita? Esta acción no se puede deshacer.")) return;

            await fetch(`/api/admin/citas/${citaSeleccionadaId}`, { method: "DELETE" });

            document.getElementById("modalDetalle").classList.remove("active");
            calendar.refetchEvents();

        });


        /* ============ CREAR CITA MANUAL ============ */

        function abrirCrear(fechaStr, dateObj) {

            // En vista mes, dateStr es solo la fecha (YYYY-MM-DD).
            // En vista semana/día, incluye también la hora exacta clickeada.
            const fecha = fechaStr.split("T")[0];

            const pad = (n) => String(n).padStart(2, "0");
            const tieneHora = fechaStr.includes("T");
            const hora = tieneHora
                ? `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`
                : "10:00";

            document.getElementById("crearFecha").value = fecha;
            document.getElementById("crearHora").value = hora;
            document.getElementById("crearDuracion").value = "30";
            document.getElementById("crearTipo").value = "valoracion";
            document.getElementById("crearNombre").value = "";
            document.getElementById("crearTelefono").value = "";
            document.getElementById("crearIdea").value = "";

            document.getElementById("modalCrear").classList.add("active");

        }

        document.getElementById("btnCerrarCrear").addEventListener("click", () => {
            document.getElementById("modalCrear").classList.remove("active");
        });

        document.getElementById("btnGuardarCrear").addEventListener("click", async () => {

            const nombre = document.getElementById("crearNombre").value.trim();

            if (!nombre) {
                alert("Ingresa el nombre del cliente.");
                return;
            }

            const respuesta = await fetch("/api/admin/citas", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nombre_cliente: nombre,
                    telefono: document.getElementById("crearTelefono").value.trim(),
                    fecha: document.getElementById("crearFecha").value,
                    hora: document.getElementById("crearHora").value,
                    duracion_minutos: document.getElementById("crearDuracion").value,
                    tipo_cita: document.getElementById("crearTipo").value,
                    idea: document.getElementById("crearIdea").value.trim(),
                }),
            });

            const data = await respuesta.json();

            if (!respuesta.ok) {
                alert(data.error || "Ese horario choca con otra cita.");
                return;
            }

            document.getElementById("modalCrear").classList.remove("active");
            calendar.refetchEvents();

        });
    </script>

</body>
</html>
