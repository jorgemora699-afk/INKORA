<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — Iniciar sesión</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-bg-soft: #111111;
            --color-white: #f5f5f5;
            --color-text: #c8c8c8;
            --color-muted: #777777;
            --color-accent: #c5a46d;
            --font-display: "Cormorant Garamond", serif;
            --font-body: "Manrope", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg);
            color: var(--color-white);
            font-family: var(--font-body);
        }

        .login-card {
            width: min(90%, 380px);
            padding: 50px 40px;
            background: var(--color-bg-soft);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-label {
            color: var(--color-accent);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 40px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 35px;
        }

        h1 em {
            font-style: italic;
            color: var(--color-muted);
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-text);
        }

        .field input {
            width: 100%;
            padding: 14px 16px;
            background: #171717;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .field input:focus {
            border-color: var(--color-accent);
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 16px;
            background: var(--color-white);
            color: var(--color-bg);
            border: none;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease;
        }

        button:hover {
            background: var(--color-accent);
        }

        .flash {
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(220, 80, 80, 0.12);
            border: 1px solid rgba(220, 80, 80, 0.4);
            color: #e28f8f;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <p class="login-label">PANEL ADMIN</p>

        <h1>Iniciar<br><em>sesión.</em></h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Entrar</button>

        </form>

    </div>

</body>
</html>
